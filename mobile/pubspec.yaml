name: petid
description: "Aplicación móvil de PetID para ciudadanos."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  geolocator: ^13.0.4
  google_sign_in: 7.1.1
  # Compatible con Android Gradle Plugin 8.7 y el Gradle del proyecto.
  google_sign_in_android: 7.0.0
  http: ^1.4.0
  http_parser: ^4.1.2
  image_picker: 1.1.2
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
