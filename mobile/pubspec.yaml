name: petid
description: "Aplicación móvil de PetID para ciudadanos."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  camera: ^0.11.2+1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  flutter_map: ^8.3.2
  geolocator: ^13.0.4
  http: ^1.4.0
  http_parser: ^4.1.2
  image_picker: 1.1.2
  latlong2: ^0.10.1
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
